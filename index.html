<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナル画像パズル</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
      max-width: 400px;
    }
    input[type="file"] {
      width: 100%;
      padding: 8px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    select, button {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background-color: #4CAF50;
      color: white;
      border: none;
      font-weight: bold;
    }
    button.primary:disabled {
      background-color: #a5d6a7;
      cursor: not-allowed;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #board {
      width: 360px;
      height: 360px;
      max-width: 90vw;
      max-height: 90vw;
      display: grid;
      gap: 2px;
      background-color: #333;
      border: 4px solid #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    #board.completed {
      gap: 0;
      border-color: #ff9800;
    }
    .tile {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .tile.selected {
      outline: 4px solid #ff5722;
      outline-offset: -4px;
      transform: scale(0.95);
      z-index: 10;
    }
    #message {
      margin-top: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #e65100;
      min-height: 1.5em;
    }
    #hint-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #hint-modal img {
      max-width: 85vw;
      max-height: 85vh;
      border: 4px solid #fff;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>🧩 オリジナル画像パズル</h1>

  <div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <select id="gridSize">
      <option value="3">3 × 3（かんたん）</option>
      <option value="4">4 × 4（ふつう）</option>
      <option value="5">5 × 5（むずかしい）</option>
    </select>
    <button id="startBtn" class="primary" disabled>スタート</button>
    <button id="hintBtn" disabled>お手本</button>
  </div>

  <div class="status-bar">
    <span>⏱ タイム: <span id="timer">00:00.0</span></span>
    <span>手数: <span id="moves">0</span></span>
  </div>

  <div id="board"></div>
  <div id="message">画像を選んで「スタート」を押してね！</div>

  <!-- お手本表示用モーダル -->
  <div id="hint-modal" onclick="this.style.display='none'">
    <img id="hint-img" src="" alt="お手本">
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const gridSizeSelect = document.getElementById('gridSize');
    const startBtn = document.getElementById('startBtn');
    const hintBtn = document.getElementById('hintBtn');
    const board = document.getElementById('board');
    const timerDisplay = document.getElementById('timer');
    const movesDisplay = document.getElementById('moves');
    const messageDisplay = document.getElementById('message');
    const hintModal = document.getElementById('hint-modal');
    const hintImg = document.getElementById('hint-img');

    let croppedImageUrl = null;
    let size = 3;
    let tiles = []; // 現在のピース配置（元のインデックスを保持）
    let selectedIndex = null;
    let moves = 0;
    let isPlaying = false;
    let startTime = 0;
    let timerInterval = null;

    // 画像選択時：正方形にトリミングしてDataURL化
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const minSide = Math.min(img.width, img.height);
          canvas.width = 600;
          canvas.height = 600;
          const ctx = canvas.getContext('2d');
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, 600, 600);

          croppedImageUrl = canvas.toDataURL('image/jpeg', 0.9);
          hintImg.src = croppedImageUrl;
          startBtn.disabled = false;
          hintBtn.disabled = false;
          messageDisplay.textContent = '「スタート」を押すと始まります！';
          previewBoard();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // プレビュー表示（未シャッフル状態）
    function previewBoard() {
      size = parseInt(gridSizeSelect.value);
      tiles = Array.from({ length: size * size }, (_, i) => i);
      board.classList.add('completed');
      renderBoard();
    }

    // ゲーム開始
    startBtn.addEventListener('click', () => {
      if (!croppedImageUrl) return;
      size = parseInt(gridSizeSelect.value);
      tiles = Array.from({ length: size * size }, (_, i) => i);

      // シャッフル（最初から揃っている状態を回避）
      do {
        for (let i = tiles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }
      } while (isSolved());

      selectedIndex = null;
      moves = 0;
      movesDisplay.textContent = moves;
      messageDisplay.textContent = '2つのピースをタップして入れ替えよう！';
      board.classList.remove('completed');
      isPlaying = true;
      renderBoard();
      startTimer();
    });

    // お手本表示
    hintBtn.addEventListener('click', () => {
      hintModal.style.display = 'flex';
    });

    // 盤面の描画
    function renderBoard() {
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      board.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      tiles.forEach((tileValue, currentIndex) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (currentIndex === selectedIndex) {
          tile.classList.add('selected');
        }

        const row = Math.floor(tileValue / size);
        const col = tileValue % size;

        tile.style.backgroundImage = `url(${croppedImageUrl})`;
        tile.style.backgroundSize = `${size * 100}% ${size * 100}%`;
        tile.style.backgroundPosition = `${(col / (size - 1)) * 100}% ${(row / (size - 1)) * 100}%`;

        tile.addEventListener('click', () => handleTileClick(currentIndex));
        board.appendChild(tile);
      });
    }

    // ピースタップ時の処理
    function handleTileClick(index) {
      if (!isPlaying) return;

      if (selectedIndex === null) {
        selectedIndex = index;
        renderBoard();
      } else if (selectedIndex === index) {
        selectedIndex = null;
        renderBoard();
      } else {
        // ピース入れ替え
        [tiles[selectedIndex], tiles[index]] = [tiles[index], tiles[selectedIndex]];
        selectedIndex = null;
        moves++;
        movesDisplay.textContent = moves;
        renderBoard();

        if (isSolved()) {
          gameClear();
        }
      }
    }

    // クリア判定
    function isSolved() {
      return tiles.every((val, idx) => val === idx);
    }

    // クリア時の処理
    function gameClear() {
      isPlaying = false;
      stopTimer();
      board.classList.add('completed');
      messageDisplay.textContent = `🎉 完成！ タイム: ${timerDisplay.textContent}`;
      playFanfare();
    }

    // タイマー関連
    function startTimer() {
      stopTimer();
      startTime = performance.now();
      timerInterval = setInterval(() => {
        const elapsed = performance.now() - startTime;
        const minutes = Math.floor(elapsed / 60000);
        const seconds = Math.floor((elapsed % 60000) / 1000);
        const tenths = Math.floor((elapsed % 1000) / 100);
        timerDisplay.textContent =
          `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${tenths}`;
      }, 100);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // クリア時の効果音（Web Audio API）
    function playFanfare() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // ド・ミ・ソ・高いド
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.12 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.12);
          osc.stop(ctx.currentTime + i * 0.12 + 0.4);
        });
      } catch (e) {
        // 音声再生非対応環境は無視
      }
    }
  </script>
</body>
</html>
